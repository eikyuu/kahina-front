<div class="themes">
    <div class="container">
        <app-title [libelle]="'Tous les themes de ' + ROUTER_PARAM_SLUG.replace('-', ' ')" [color]="'#202020'" />
        <div class="container-page container-page__grid">
            <app-theme *ngFor="let theme of themes; trackBy:trackByFn" [theme]="theme"/>
        </div>
    </div>
</div>
