<div class="login">
    <app-title title="Connexion" color="#202020" />

    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login__form">

        <div class="login__ctn">
            <label for="email" class="login__label">
                <div *ngIf="submitted && form?.['email']?.errors?.['required']" class="login__label-error">
                    <span>Email requis</span>
                </div>
                <div *ngIf="submitted && form?.['email']?.errors?.['email']" class="login__label-error">
                    <span>Email invalide</span>
                </div>
            </label>
            <input type="email" id="email" placeholder="Email" class="input" formControlName="email" required />
        </div>

        <div class="login__ctn">
            <label for="password" class="login__label">
                <div *ngIf="submitted && form?.['password']?.errors?.['required']" class="login__label-error">
                    <span>Mot de passe requis</span>
                </div>
            </label>
            <input type="password" id="password" placeholder="Mot de passe" class="input" formControlName="password"
                required />
        </div>

    </form>

</div>
