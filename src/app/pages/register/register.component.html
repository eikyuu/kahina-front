<div class="login">
  <app-title color="'#202020'" tag="h1" title="Inscription"/>

  <form [formGroup]="registerForm" class="login__form" (ngSubmit)="onSubmit()">

    <div class="login__ctn">
      <label for="pseudo" class="login__label">
        <div *ngIf="form?.['pseudo']?.errors?.['required']" class="login__label-error">
          <span>Pseudo requis</span>
        </div>
      </label>
      <input type="text" id="pseudo" placeholder="Pseudo" class="input" formControlName="pseudo" required />
    </div>

    <div class="login__ctn">
      <label for="email" class="login__label">
        <div *ngIf="form?.['email']?.errors?.['required']" class="login__label-error">
          <span>Email requis</span>
        </div>
        <div *ngIf="form?.['email']?.errors?.['email']"
          class="login__label-error">
          <span>Email invalide</span>
        </div>
      </label>
      <input type="email" id="email" placeholder="Email" class="input" formControlName="email" required />
    </div>

    <div class="login__ctn">
      <label for="password" class="login__label">
        <div *ngIf="form?.['password']?.errors?.['required']"
          class="login__label-error">
          <span>Mot de passe requis</span>
        </div>
      </label>
      <input type="password" id="password" placeholder="Mot de passe" class="input" formControlName="password"
        required />
    </div>

    <app-button [libelle]="'Inscription'" [background]="'#D9D9D9'" [color]="'#202020'" [type]="'submit'" />
  </form>

</div>
