<div class="figures">
    <div class="container">

        <app-title title="'Tous les membres de ' + ROUTER_PARAM_SLUG.replace('-', ' ')" tag="h2" color="'#202020'" />

        <div class="container-page">
            <div class="app-character" *ngFor="let character of figures | paginate : { itemsPerPage: 12, currentPage: currentPage }; trackBy:trackByFn">
              <app-card-character [character]="character"  />
            </div>
        </div>
        <pagination-controls
        class="my-pagination"  
        (pageChange)="currentPage = $event"
        [directionLinks]="true"
        [autoHide]="true"
        previousLabel="Précédent"
        nextLabel="Suivant"
        screenReaderPaginationLabel="Pagination"
        screenReaderPageLabel="page"
        screenReaderCurrentLabel="You're on page"
      >
        ></pagination-controls
      >
    </div>
</div>
