<div class="review">
  <div class="container">
    <app-title
      [title]="'les avis pour ' + ROUTER_PARAM_SLUG.replace('-', ' ')"
      [color]="'#202020'"
    />
    <div class="container-page">
      <app-review
        [review]="review"
        *ngFor="
          let review of reviews
            | paginate : { itemsPerPage: 12, currentPage: currentPage };
          trackBy: trackByFn
        "
      />
    </div>
    <pagination-controls
      class="my-pagination"  
      (pageChange)="currentPage = $event"
      [directionLinks]="true"
      [autoHide]="true"
      previousLabel="Précédent"
      nextLabel="Suivant"
      screenReaderPaginationLabel="Pagination"
      screenReaderPageLabel="page"
      screenReaderCurrentLabel="You're on page"
    >
      ></pagination-controls>
  </div>
</div>
