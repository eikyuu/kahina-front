
<section *ngIf='article' class="container-article pt-2">
    <div class="container container-white">
        <img [src]="imageUrl" alt="icon license" class="container-article__img">
        <h1>{{article.title}}</h1>
        <p>Par {{article.author}} le {{article.createdAt | date: 'd MMMM yyyy' : '' : 'fr-FR' }}</p>
    </div>
    <div class="container container-white mt-2 p-2">
        <div [innerHTML]="article.content"></div>
    </div>
</section>
