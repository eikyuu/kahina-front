<section class="container card-anime">
  <ng-container *ngIf="!isMobile">
    <ng-container *ngIf="animes; else skeleton">
      <app-card-anime
        *ngFor="
          let anime of animes | sortBy : 'desc' : sortBy | slice : 0 : 6;
          trackBy: trackByFn
        "
        [anime]="anime"
      />
    </ng-container>
  </ng-container>

  <swiper-container
    *ngIf="isMobile"
    class="mySwiper"
    space-between="16"
    slides-per-view="auto"
    speed="500"
  >
    <swiper-slide
      *ngFor="
        let anime of animes | sortBy : 'desc' : sortBy | slice : 0 : 6;
        trackBy: trackByFn
      "
    >
      <app-card-anime [anime]="anime" />
    </swiper-slide>
  </swiper-container>
</section>

<ng-template #skeleton>
  <div class="container-skeleton" *ngIf="!animes">
    <ngx-skeleton-loader
      *ngFor="let number of [0, 1, 2, 3]"
      [theme]="{
        width: '252px',
        height: '350px',
        'border-radius': '10px',
        margin: '0 auto 0 auto'
      }"
    />
  </div>
</ng-template>
